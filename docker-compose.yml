name: invoicespot-stack

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoicespot}
      POSTGRES_USER: ${POSTGRES_USER:-invoicespot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    volumes:
      - app_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./florin/client
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.15
    profiles:
      - mail
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8027}:8025"

volumes:
  db_data:
  app_data:
