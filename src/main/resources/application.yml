spring:
  application:
    name: florin

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5442}/${POSTGRES_DB:invoicespot}
    username: ${POSTGRES_USER:invoicespot}
    password: ${POSTGRES_PASSWORD:invoicespot}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  mail:
    host: ${EMAIL_HOST:localhost}
    port: ${EMAIL_PORT:1026}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 10000
          timeout: 30000
          writetimeout: 30000

  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    generator:
      write-bigdecimal-as-plain: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  servlet:
    context-path: /

management:
  server:
    port: ${MANAGEMENT_PORT:}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET_KEY}
    access-token-ttl: PT10M
    refresh-token-ttl: P1D
  encryption:
    key: ${APP_ENCRYPTION_KEY:}
  cookie:
    refresh-name: jwt
    path: /
    same-site: Lax
    secure: ${COOKIE_SECURE:true}
  site:
    name: ${SITE_NAME:Florin}
    client-url: ${CLIENT_URL:http://localhost:3000}
    server-url: ${SERVER_URL:http://localhost:8080}
    default-from-email: ${SENDER_EMAIL:support@florin.local}
  verification:
    token-ttl: PT15M
  upload:
    dir: ${UPLOAD_DIR:uploads}
  demo:
    email: ${DEMO_EMAIL:guest@demo.invoicespot.local}
    seed: ${DEMO_SEED:false}
    reset: ${DEMO_RESET:${DEMO_SEED:false}}
  oauth:
    redirect-base: ${OAUTH_REDIRECT_BASE:${app.site.client-url}}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  jobs:
    enabled: ${JOBS_ENABLED:true}
    cron: ${JOBS_CRON:0 0 7 * * *}
    zone: ${JOBS_ZONE:UTC}
  rate-limit:
    shared: ${RATE_LIMIT_SHARED:true}

logging:
  level:
    com.florin: ${LOG_LEVEL:INFO}
